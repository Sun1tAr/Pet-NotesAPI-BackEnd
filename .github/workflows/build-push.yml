name: Build, Push & Deploy to VPS

on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          envs: POSTGRES_PASSWORD,GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY
          script: |
            echo "=== Starting deployment ==="
            cd /opt/pet-notes-api
            
            # Логин в GHCR с токеном
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            
            # Подтянуть свежий образ
            echo "=== Pulling latest image ==="
            docker pull ghcr.io/${GITHUB_REPOSITORY}:latest
            
            # Остановить старые контейнеры (БД volumes остаются!)
            echo "=== Stopping old containers ==="
            docker-compose down
            
            # Запустить новые с переменными окружения
            echo "=== Starting new containers ==="
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            docker-compose up -d
            
            # Ждём, пока приложение поднимется
            echo "=== Waiting for app to be healthy ==="
            sleep 10
            docker-compose logs app
            
            # Проверка здоровья
            if docker compose ps | grep -q "healthy\|Up"; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Deployment failed!"
              exit 1
            fi
            
            # Очистка
            echo "=== Cleaning up ==="
            docker logout ghcr.io
            docker image prune -f
