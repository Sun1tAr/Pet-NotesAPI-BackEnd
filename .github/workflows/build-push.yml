name: Build, Push & Deploy to VPS

on: [push]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert image name to lowercase
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_NAME: sun1tar/pet-notesapi-backend
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          envs: POSTGRES_PASSWORD,GITHUB_TOKEN,GITHUB_ACTOR,IMAGE_NAME
          script: |
            set -e
            
            echo "=== Starting deployment ==="
            
            # Если директория содержит папку репозитория - переместить всё наружу
            if [ -d "/opt/pet-notes-api/Pet-NotesAPI-BackEnd" ]; then
              echo "=== Reorganizing directory structure ==="
              cd /opt/pet-notes-api
              # Переместить всё (включая скрытые файлы) наружу
              find Pet-NotesAPI-BackEnd -mindepth 1 -maxdepth 1 -exec mv {} . \;
              # Удалить пустую папку
              rm -rf Pet-NotesAPI-BackEnd
              echo "✅ Directory reorganized"
            fi
            
            cd /opt/pet-notes-api
            
            # Убедиться, что docker-compose.yml существует
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ docker-compose.yml not found!"
              ls -la
              exit 1
            fi
            
            # Логин в GHCR с токеном
            echo "=== Logging in to GHCR ==="
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            
            # Подтянуть свежий образ
            echo "=== Pulling latest image ==="
            docker pull ghcr.io/${IMAGE_NAME}:latest
            
            # Остановить старые контейнеры (БД volumes остаются!)
            echo "=== Stopping old containers ==="
            docker compose down || true
            
            # Запустить новые с переменными окружения
            echo "=== Starting new containers ==="
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            docker compose up -d
            
            # Ждём, пока приложение поднимется
            echo "=== Waiting for app to be healthy ==="
            sleep 15
            docker compose logs app
            
            # Проверка здоровья
            if docker compose ps | grep -q "healthy\|Up"; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Deployment failed!"
              docker compose logs
              exit 1
            fi
            
            # Очистка
            echo "=== Cleaning up ==="
            docker logout ghcr.io
            docker image prune -f
