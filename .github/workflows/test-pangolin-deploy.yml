name: Deploy to Home Server via Pangolin

on:
  push:
    branches:
      - dev/pangolin
      - main

env:
  PANGOLIN_ENDPOINT: "https://root.sun1tar.tech"
  PANGOLIN_MACHINE_ID: ${{ secrets.PANGOLIN_MACHINE_ID }}
  PANGOLIN_MACHINE_SECRET: ${{ secrets.PANGOLIN_MACHINE_SECRET }}
  SSH_ALIAS: ${{ secrets.SSH_ALIAS }}
  SSH_USER: ${{ secrets.SSH_USER }}
  TEST_DIR: "/home/sun1tar/pangolin-test"
  ORG_NAME: "tested"

jobs:
  deploy:
    name: Deploy to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pangolin CLI
        run: |
          curl -fsSL https://static.pangolin.net/get-cli.sh | bash
          sudo mv pangolin /usr/local/bin/ || true

      - name: Generate random filename
        id: random
        run: |
          RANDOM_NAME="test-$(date +%Y%m%d-%H%M%S)-$(openssl rand -hex 4).txt"
          echo "filename=$RANDOM_NAME" >> $GITHUB_OUTPUT
          echo "📝 Generated filename: $RANDOM_NAME"

      - name: Connect and Execute commands on home server
        env:
          PANGOLIN_MACHINE_ID: ${{ secrets.PANGOLIN_MACHINE_ID }}
          PANGOLIN_MACHINE_SECRET: ${{ secrets.PANGOLIN_MACHINE_SECRET }}
          PANGOLIN_ENDPOINT: ${{ env.PANGOLIN_ENDPOINT }}
          PANGOLIN_ORG: ${{ env.ORG_NAME }} # Передаем организацию через системную переменную Pangolin
        run: |
          # 1. Запускаем туннель в фоне. Флаг -E передает все env-переменные внутрь sudo
          sudo -E pangolin up \
            --id "$PANGOLIN_MACHINE_ID" \
            --secret "$PANGOLIN_MACHINE_SECRET" \
            --endpoint "$PANGOLIN_ENDPOINT" \
            --attach &

          # 2. Даем 10 секунд на полную установку WireGuard соединения
          sleep 10

          # 3. Выполняем SSH команду. 
          # Мы убрали флаг --org из текста команды и передаем его глобально через sudo -E
          sudo -E pangolin ssh \
            ${{ env.SSH_USER }}@${{ env.SSH_ALIAS }} \
            "mkdir -p ${{ env.TEST_DIR }} && \
             echo 'Test file created at \$(date) from GitHub Actions' > ${{ env.TEST_DIR }}/${{ steps.random.outputs.filename }} && \
             ls -la ${{ env.TEST_DIR }}/"

