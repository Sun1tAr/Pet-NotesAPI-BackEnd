name: Deploy to Home Server via Pangolin

on:
  push:
    branches:
      - dev/pangolin
      - main

env:
  PANGOLIN_ENDPOINT: "https://root.sun1tar.tech"
  PANGOLIN_MACHINE_ID: ${{ secrets.PANGOLIN_MACHINE_ID }}
  PANGOLIN_MACHINE_SECRET: ${{ secrets.PANGOLIN_MACHINE_SECRET }}
  SSH_ALIAS: ${{ secrets.SSH_ALIAS }}
  SSH_USER: ${{ secrets.SSH_USER }}
  TEST_DIR: "/home/sun1tar/pangolin-test"

jobs:
  deploy:
    name: Deploy to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pangolin CLI
        run: |
          curl -fsSL https://static.pangolin.net/get-cli.sh | sudo bash

      - name: Login as Machine Client
        run: |
          pangolin auth login \
            --id ${{ env.PANGOLIN_MACHINE_ID }} \
            --secret ${{ env.PANGOLIN_MACHINE_SECRET }} \
            --endpoint ${{ env.PANGOLIN_ENDPOINT }}

      - name: Connect to Pangolin network
        run: |
          pangolin up --attach &
          sleep 5
          pangolin status

      - name: Generate random filename
        id: random
        run: |
          RANDOM_NAME="test-$(date +%Y%m%d-%H%M%S)-$(openssl rand -hex 4).txt"
          echo "filename=$RANDOM_NAME" >> $GITHUB_OUTPUT
          echo "📝 Generated filename: $RANDOM_NAME"

      - name: Execute commands on home server
        run: |
          pangolin ssh ${{ env.SSH_USER }}@${{ env.SSH_ALIAS }} << 'ENDSSH'
            echo "✅ Connected to home server!"
            echo "📍 Current user: $(whoami)"
            echo "📂 Current directory: $(pwd)"
          
            echo "📂 Creating test directory..."
            mkdir -p ${{ env.TEST_DIR }}
          
            echo "📝 Creating test file: ${{ steps.random.outputs.filename }}"
            echo "Test file created at $(date) from GitHub Actions via Pangolin Machine Client" > ${{ env.TEST_DIR }}/${{ steps.random.outputs.filename }}
          
            echo "📋 Listing files:"
            ls -la ${{ env.TEST_DIR }}/
          
            echo "✅ Deployment completed successfully!"
            ENDSSH

      - name: Verify deployment
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📁 Test file: ${{ steps.random.outputs.filename }}"
          echo "📍 Location: /home/sun1tar/pangolin-test/ on home server"