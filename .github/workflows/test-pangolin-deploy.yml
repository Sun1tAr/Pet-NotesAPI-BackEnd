name: Deploy to Home Server via Pangolin

on:
  push:
    branches:
      - dev/pangolin
      - main

env:
  PANGOLIN_ENDPOINT: "https://root.sun1tar.tech"
  PANGOLIN_MACHINE_ID: ${{ secrets.PANGOLIN_MACHINE_ID }}
  PANGOLIN_MACHINE_SECRET: ${{ secrets.PANGOLIN_MACHINE_SECRET }}
  SSH_ALIAS: ${{ secrets.SSH_ALIAS }}
  SSH_USER: ${{ secrets.SSH_USER }}
  TEST_DIR: "/home/sun1tar/pangolin-test"
  ORG_NAME: "tested"

jobs:
  deploy:
    name: Deploy to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pangolin CLI
        run: |
          curl -fsSL https://static.pangolin.net/get-cli.sh | bash
          sudo mv pangolin /usr/local/bin/ || true

      - name: Generate random filename
        id: random
        run: |
          RANDOM_NAME="test-$(date +%Y%m%d-%H%M%S)-$(openssl rand -hex 4).txt"
          echo "filename=$RANDOM_NAME" >> $GITHUB_OUTPUT
          echo "📝 Generated filename: $RANDOM_NAME"

      - name: Connect and Execute commands on home server
        env:
          PANGOLIN_MACHINE_ID: ${{ secrets.PANGOLIN_MACHINE_ID }}
          PANGOLIN_MACHINE_SECRET: ${{ secrets.PANGOLIN_MACHINE_SECRET }}
          PANGOLIN_ENDPOINT: ${{ env.PANGOLIN_ENDPOINT }}
        run: |
          # 1. Поднимаем системный WireGuard туннель Pangolin в фоне
          sudo pangolin up \
            --id "$PANGOLIN_MACHINE_ID" \
            --secret "$PANGOLIN_MACHINE_SECRET" \
            --endpoint "$PANGOLIN_ENDPOINT" \
            --attach &

          # 2. Даем 5 секунд до момента успешного CONNECTED
          sleep 5

          # 3. КРИТИЧЕСКИЙ ШАГ: Запускаем фоновый пинг DNS-сервера Pangolin (100.96.128.1).
          # Это генерирует постоянный микро-трафик и НЕ ДАСТ туннелю уйти в DISCONNECTED!
          ping -i 1 100.96.128.1 > /dev/null &
          
          # Ждем еще 3 секунды, чтобы зафиксировать трафик
          sleep 3

          # 4. Проверяем статус (теперь он гарантированно будет Connected)
          sudo pangolin status || true

          # 5. Используем стандартный нативный SSH, который теперь легко пройдет через "разогретый" туннель
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ env.SSH_USER }}@${{ env.SSH_ALIAS }} \
              "mkdir -p ${{ env.TEST_DIR }} && \
               echo 'Test file created via Warmed Up Pangolin Tunnel' > ${{ env.TEST_DIR }}/${{ steps.random.outputs.filename }} && \
               ls -la ${{ env.TEST_DIR }}/"



