name: Deploy to Home Server via Pangolin

on:
  push:
    branches:
      - dev/pangolin
      - main

env:
  PANGOLIN_ENDPOINT: "https://root.sun1tar.tech"
  PANGOLIN_MACHINE_ID: ${{ secrets.PANGOLIN_MACHINE_ID }}
  PANGOLIN_MACHINE_SECRET: ${{ secrets.PANGOLIN_MACHINE_SECRET }}
  SSH_ALIAS: ${{ secrets.SSH_ALIAS }}
  SSH_USER: ${{ secrets.SSH_USER }}
  TEST_DIR: "/home/sun1tar/pangolin-test"
  ORG_NAME: "tested"

jobs:
  deploy:
    name: Deploy to Home Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pangolin CLI
        run: |
          curl -fsSL https://static.pangolin.net/get-cli.sh | bash
          sudo mv pangolin /usr/local/bin/ || true

      - name: Connect to Pangolin as Machine Client
        run: |
          # Запускаем туннель строго с поддерживаемыми флагами документации.
          # Флаг --attach не дает процессу закрыться и отключает интерактивность.
          sudo pangolin up \
            --id "$PANGOLIN_MACHINE_ID" \
            --secret "$PANGOLIN_MACHINE_SECRET" \
            --endpoint "$PANGOLIN_ENDPOINT" \
            --attach &

          # Даем 7 секунд на установку WireGuard соединения в фоне
          sleep 7

          # Проверяем, что клиент успешно подключился
          pangolin status

      - name: Generate random filename
        id: random
        run: |
          RANDOM_NAME="test-$(date +%Y%m%d-%H%M%S)-$(openssl rand -hex 4).txt"
          echo "filename=$RANDOM_NAME" >> $GITHUB_OUTPUT
          echo "📝 Generated filename: $RANDOM_NAME"

      - name: Execute commands on home server
        run: |
          # Ждем, пока установится соединение
          sleep 5
          sudo pangolin ssh \
            --org "$ORG_NAME" \
            ${{ env.SSH_USER }}@${{ env.SSH_ALIAS }} \
            "mkdir -p ${{ env.TEST_DIR }} && \
             echo 'Test file created at $(date) from GitHub Actions via Pangolin Machine Client' > ${{ env.TEST_DIR }}/${{ steps.random.outputs.filename }} && \
             ls -la ${{ env.TEST_DIR }}/"