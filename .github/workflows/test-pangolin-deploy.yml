name: Test Deployment via Public SSH

on:
  push:
    branches:
      - dev/pangolin

env:
  SSH_HOST: ${{ secrets.SSH_PUBLIC_HOST }}  # например, ssh.sun1tar.tech
  SSH_USER: ${{ secrets.SSH_USER }}          # sun1tar
  SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}    # приватный ключ для домашнего сервера
  TEST_DIR: "/home/sun1tar/pangolin-test"

jobs:
  test-deployment:
    name: Create test file on home server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Generate random filename
        id: random
        run: |
          RANDOM_NAME="test-$(date +%Y%m%d-%H%M%S)-$(openssl rand -hex 4).txt"
          echo "filename=$RANDOM_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to home server
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} << 'EOF'
            mkdir -p ${{ env.TEST_DIR }}
            echo "Test file created at $(date) from GitHub Actions via public SSH" > ${{ env.TEST_DIR }}/${{ steps.random.outputs.filename }}
            ls -la ${{ env.TEST_DIR }}/
            EOF