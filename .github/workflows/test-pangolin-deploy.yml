name: Test Pangolin Deployment

on:
  push:
    branches:
      - dev/pangolin

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  SSH_ALIAS: ${{ secrets.SSH_ALIAS }}
  SSH_USER: ${{ secrets.SSH_USER }}
  TEST_DIR: "/home/sun1tar/pangolin-test"

jobs:
  test-deployment:
    name: Create test file on home server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key for VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy SSH key to VPS for home server
        run: |
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "mkdir -p ~/.ssh && cat > ~/.ssh/id_rsa << 'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF"
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "chmod 600 ~/.ssh/id_rsa"

      - name: Generate random filename
        id: random
        run: |
          RANDOM_NAME="test-$(date +%Y%m%d-%H%M%S)-$(openssl rand -hex 4).txt"
          echo "filename=$RANDOM_NAME" >> $GITHUB_OUTPUT

      - name: Deploy test file to home server
        run: |
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
            pangolin ssh ${{ env.SSH_USER }}@${{ env.SSH_ALIAS }} -i ~/.ssh/id_rsa << 'ENDSSH'
              mkdir -p ${{ env.TEST_DIR }}
              echo "Test file created at $(date) from GitHub Actions via VPS relay" > ${{ env.TEST_DIR }}/${{ steps.random.outputs.filename }}
              ls -la ${{ env.TEST_DIR }}
  ENDSSH
  EOF