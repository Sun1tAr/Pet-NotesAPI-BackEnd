name: Test Pangolin Deployment

on:
  push:
    branches:
      - dev/pangolin

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  SSH_ALIAS: ${{ secrets.SSH_ALIAS }}
  SSH_USER: ${{ secrets.SSH_USER }}
  TEST_DIR: "/home/sun1tar/pangolin-test"

jobs:
  test-deployment:
    name: Create test file on home server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key for VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Set up SSH key for home server (on VPS)
        run: |
          # Копируем приватный ключ для домашнего сервера на VPS
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            echo "✅ SSH key for home server installed on VPS"
ENDSSH

      - name: Generate random filename
        id: random
        run: |
          RANDOM_NAME="test-$(date +%Y%m%d-%H%M%S)-$(openssl rand -hex 4).txt"
          echo "filename=$RANDOM_NAME" >> $GITHUB_OUTPUT
          echo "📝 Generated filename: $RANDOM_NAME"

      - name: Create test file on home server via VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            echo "✅ Connected to VPS"
          
            echo "📋 Checking Pangolin client status..."
            pangolin status || {
              echo "❌ Pangolin client not running! Starting..."
              sudo systemctl restart pangolin-relay
              sleep 5
            }
          
            echo "📋 Listing available aliases..."
            pangolin list aliases
          
            echo "📂 Creating test directory on home server..."
            pangolin ssh ${{ env.SSH_USER }}@${{ env.SSH_ALIAS }} -i ~/.ssh/id_rsa "mkdir -p ${{ env.TEST_DIR }}"
          
            echo "📝 Creating test file: ${{ steps.random.outputs.filename }}"
            pangolin ssh ${{ env.SSH_USER }}@${{ env.SSH_ALIAS }} -i ~/.ssh/id_rsa \
              "echo 'Test file created at $(date) from GitHub Actions via VPS relay' > ${{ env.TEST_DIR }}/${{ steps.random.outputs.filename }}"
          
            echo "📋 Listing files on home server..."
            pangolin ssh ${{ env.SSH_USER }}@${{ env.SSH_ALIAS }} -i ~/.ssh/id_rsa "ls -la ${{ env.TEST_DIR }}/"
          
            echo "✅ Test file successfully created on home server!"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📁 Test file: ${{ steps.random.outputs.filename }}"
          echo "📍 Location: /home/sun1tar/pangolin-test/ on home server"
          echo "🔗 GitHub Actions → VPS (SSH) → Home Server (pangolin ssh -i key)"