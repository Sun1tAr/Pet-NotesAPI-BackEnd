name: Build, Push & Deploy to VPS

on: [push]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert image name to lowercase
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: ".docker/docker-compose.yml,.nginx/pet-notes-api.conf.template"
          target: "/opt/pet-notes-api/"

      - name: Deploy Docker containers
        uses: appleboy/ssh-action@v1.0.0
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_NAME: sun1tar/pet-notesapi-backend
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          envs: POSTGRES_PASSWORD,GITHUB_TOKEN,GITHUB_ACTOR,IMAGE_NAME
          script: |
            set -e
            echo "=== Starting Docker deployment ==="
            cd /opt/pet-notes-api
            echo "=== Logging in to GHCR ==="
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            echo "=== Pulling latest image ==="
            docker pull ghcr.io/${IMAGE_NAME}:latest
            echo "=== Cleaning up old containers ==="
            docker-compose down --remove-orphans || true
            docker container rm -f notes-api-app pg_notes 2>/dev/null || true
            docker network rm pet-notes-api_default 2>/dev/null || true
            docker container prune -f
            docker network prune -f
            fuser -k 8888/tcp 2>/dev/null || true
            sleep 2
            echo "=== Starting new containers ==="
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" .docker/docker-compose up -d
            echo "=== Waiting for app to be healthy ==="
            sleep 15
            docker-compose logs app
            if docker-compose ps | grep -q "Up"; then
              echo "✅ Docker deployment successful!"
            else
              echo "❌ Docker deployment failed!"
              docker-compose logs
              exit 1
            fi
            echo "=== Cleaning up Docker ==="
            docker logout ghcr.io
            docker image prune -f

  configure-nginx:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Nginx config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: ".nginx/pet-notes-api.conf.template"
          target: "/opt/pet-notes-api/"

      - name: Configure Nginx
        uses: appleboy/ssh-action@v1.0.0
        env:
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          envs: SERVER_NAME,REPO_NAME
          script: |
            set -e
            echo "=== Configuring Nginx ==="
            cd /opt/pet-notes-api
            
            # Подстановка переменных
            envsubst '${SERVER_NAME} ${REPO_NAME}' < .nginx/pet-notes-api.conf.template > /tmp/pet-notes-api.conf
            
            # Копируем СНАЧАЛА
            sudo cp /tmp/pet-notes-api.conf /etc/nginx/apps-available/pet-notes-api.conf
            sudo ln -sf /etc/nginx/apps-available/pet-notes-api.conf /etc/nginx/apps-enabled/
            
            sudo nginx -t && sudo systemctl reload nginx
  
            echo "✅ http://${SERVER_NAME}/${REPO_NAME}"

