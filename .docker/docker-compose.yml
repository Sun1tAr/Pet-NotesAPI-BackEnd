volumes:
  pg_notes_vol:

services:
  pg_notes:
    image: postgres:16-alpine
    container_name: notes-api-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_notes_vol:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/sun1tar/pet-notesapi-backend:latest
    container_name: notes-api-app
    restart: always
    ports:
      - "8888:8080"
    depends_on:
      pg_notes:
        condition: service_healthy
    environment:
      POSTGRES_URL_NaPi2178e872: jdbc:postgresql://notes-api-db:5432/${DB_NAME}
      POSTGRES_USER_NaPi2178e872: ${POSTGRES_USER}
      POSTGRES_PASSWORD_NaPi2178e872: ${POSTGRES_PASSWORD}
      JAVA_OPTS: -Xmx512m
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
